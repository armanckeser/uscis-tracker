name: Deploy browser-only tracker

# Builds the static, no-server tracker and serves it from GitHub Pages.
# Pages has to be enabled once in the repository settings (Source: GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only the public repository hosts the site.
    if: github.repository == 'armanckeser/uscis-tracker'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      # base_path is "/uscis-tracker" for a project site and empty on a custom domain.
      - run: npx tsc -b && npx vite build --mode static --base="${{ steps.pages.outputs.base_path }}/"
        env:
          # The link preview needs the site's full address (see sharePreview in vite.config.ts).
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      # A preview image that 404s shows up as a blank card, not a failed build.
      - name: Check the share preview points at a file that shipped
        run: |
          grep -q 'property="og:image" content="${{ steps.pages.outputs.base_url }}/og.jpg"' dist/index.html
          test -f dist/og.jpg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
